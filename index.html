        .voice-play-btn:active { transform: scale(0.94); }

        .interactive-song { cursor: pointer; animation: songFloatGlow 3s ease-in-out infinite; will-change: transform; }
        .interactive-song:hover { filter: drop-shadow(0 20px 35px rgba(0,0,0,0.85)) drop-shadow(0 0 30px rgba(243, 219, 160, 0.9)) !important; transform: scale(1.06) translateY(-4px); }

        .scroll-hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 15; display: flex; flex-direction: column; align-items: center; color: #f3dbb0; font-size: 0.8rem; letter-spacing: 1.2px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); pointer-events: none; animation: scrollBounce 2s ease-in-out infinite; opacity: 0.9; transition: opacity 0.5s ease; }
        .scroll-hint svg { width: 18px; height: 18px; margin-top: 3px; stroke: #f3dbb0; }

        .explosion-particle { position: fixed; pointer-events: none; background: radial-gradient(circle, #fff 0%, #f3dbb0 50%, rgba(243,219,160,0) 100%); border-radius: 50%; z-index: 99998; animation: explodeAnim 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }


        /* ==================== 6. NAVIGATION BUTTONS ==================== */
        .back-btn-pos, .moment-back-btn, .flowers-back-btn { position: absolute; cursor: pointer; z-index: 10; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6)) drop-shadow(0 0 10px rgba(243, 219, 160, 0.3)); transition: transform 0.25s ease; will-change: transform; }
        .back-btn-pos:hover, .moment-back-btn:hover, .flowers-back-btn:hover { transform: scale(1.08); }
        .back-btn-pos { bottom: 3%; left: 5%; width: 14%; }
        #screen-3 .back-btn-pos { bottom: -4%; left: 4.5%; width: 15%; }
        .moment-back-btn { top: 90.9%; left: 44%; width: 15%; }
        .flowers-back-btn { top: 83%; left: 82%; width: 15%; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loader-text">loading our story...</div>
            <div class="loader-bar-container">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
            <div class="loader-percentage" id="loaderPercentage">0%</div>
        </div>
    </div>

    <canvas id="magic-canvas"></canvas>
    
    <!-- Audio Elements: Background Music & Voice Note -->
    <audio id="bgMusic" src="beabadoobee-glue-song.mp3" preload="auto" loop></audio>
    <audio id="voiceAudio" src="note.mp3" preload="auto"></audio>

    <!-- Photo Modal -->
    <div id="photo-modal">
        <div class="modal-close-btn" onclick="closeModal()">&times;</div>
        <div class="modal-img-container">
            <img id="modal-img" src="" alt="Zoomed Photo">
        </div>
    </div>

    <!-- Voice Modal -->
    <div id="voiceModal">
        <div class="voice-modal-content">
            <div class="modal-close-btn" style="position:absolute; top:18px; right:18px; width:38px; height:38px; font-size:20px;" onclick="closeVoiceModal()">&times;</div>
            <div class="voice-title">Pesan Suara</div>
            
            <div class="cassette-container">
                <img src="kaset.png" alt="Kaset" class="cassette-img" loading="lazy">
                <div class="cassette-reel left-reel" id="reelLeft"></div>
                <div class="cassette-reel right-reel" id="reelRight"></div>
            </div>

            <button class="voice-play-btn" onclick="togglePlayVoice()">
                <svg id="playIconSvg" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
                <svg id="pauseIconSvg" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
            </button>
        </div>
    </div>

    <!-- Card Container & Screens -->
    <div class="card-container" id="mainCard">

        <!-- Screen 1 -->
        <div id="screen-1" class="screen">
            <img src="section-1-item-1.png" class="s1-item-1" loading="lazy">
            <img src="section-1-item-2.png" class="s1-item-2" loading="lazy">
            <img src="section-1-item-6.png" class="s1-item-6" loading="lazy">
            <img src="section-1-item-5.png" class="s1-item-5" loading="lazy">
            <img src="section-1-item-4.png" class="s1-item-4" loading="lazy">
            <img src="section-1-item-3.png" class="s1-item-3" loading="lazy">
            <img src="section-1-item-7.png" class="s1-title" loading="lazy">
            <img src="section-1-item-8.png" class="s1-instruction" loading="lazy">
            <div class="envelope-target" onclick="openSurprise()"></div>
        </div>

        <!-- Screen 2 -->
        <div id="screen-2" class="screen">
            <img src="section-2-background.png" class="bg-ref" loading="lazy">
            <img src="section-2-item-2.png" class="s2-item-tl" loading="lazy">
            <img src="section-2-item-1.png" class="s2-item-bl" loading="lazy">
            <img src="section-2-item-3.png" class="s2-item-3" loading="lazy">
            <img src="section-2-item-4.png" class="s2-item-4" loading="lazy">
            <img src="section-2-item-5.png" class="s2-item-5" loading="lazy">
            <img src="section-2-item-6.png" class="s2-gift" loading="lazy">
            <img src="section-2-item-7.png" class="s2-text-left" loading="lazy">
            <img src="section-2-item-8.png" class="s2-text-center" loading="lazy">
            <img src="section-2-item-9.png" class="s2-text-right" loading="lazy">
            <div class="menu-item-1" onclick="goToScreen('screen-3', 'slide')"></div>
            <div class="menu-item-2" onclick="goToScreen('screen-moment', 'rotate')"></div>
            <div class="menu-item-3" onclick="goToScreen('screen-6', 'zoom')"></div>
        </div>

        <!-- Screen 3 -->
        <div id="screen-3" class="screen">
            <img src="section-3-item-1.png" class="s3-item-1" loading="lazy">
            <img src="section-3-item-2.png" class="s3-item-2" loading="lazy">
            <img src="back.png" class="back-btn-pos" onclick="goToScreen('screen-2', 'slide')" loading="lazy">
        </div>

        <!-- Screen Moment -->
        <div id="screen-moment" class="screen">
            <div class="moment-scroll-container" id="momentScroll">
                <div class="moment-content-wrapper">
                    <img src="section-4-item-1.png" class="s4-item-1" loading="lazy">
                    <img src="section-4-item-2.png" class="s4-item-2" loading="lazy">
                    <img src="section-4-item-3.png" class="s4-item-3" loading="lazy">
                    <img src="section-4-item-4.png" class="s4-item-4" loading="lazy">
                    <img src="section-5-item-1.png" class="s5-item-1 interactive-photo" onclick="handlePhotoClick(event)" loading="lazy">
                    <img src="section-5-item-2.png" class="s5-item-2" loading="lazy">
                    <img src="section-5-item-3.png" class="s5-item-3" loading="lazy">
                    <img src="section-5-item-4.png" class="s5-item-4" loading="lazy">
                    <img src="back.png" class="moment-back-btn" onclick="goToScreen('screen-2', 'rotate')" loading="lazy">
                </div>
            </div>
            <div class="scroll-hint" id="scrollHint">
                <span>Scroll ke Bawah</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 7l5 5 5-5"/></svg>
            </div>
        </div>

        <!-- Screen 6 -->
        <div id="screen-6" class="screen">
            <img src="section-6-item-1.png" class="s6-item-1" loading="lazy">
            <img src="section-6-item-2.png" class="s6-item-2" loading="lazy">
            <img src="section-6-item-3.png" class="s6-item-3" loading="lazy">
            <img src="section-6-item-4.png" class="s6-item-4 interactive-song" onclick="openVoiceModal()" loading="lazy">
            <img src="back.png" class="flowers-back-btn" onclick="goToScreen('screen-2', 'zoom')" loading="lazy">
        </div>

    </div>

    <script>
        /* ==================== 1. ASSET PRELOADER & TRACKER ==================== */
        window.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('img');
            const bgMusic = document.getElementById('bgMusic');
            const voiceAudio = document.getElementById('voiceAudio');
            const loaderBar = document.getElementById('loaderBar');
            const loaderPercentage = document.getElementById('loaderPercentage');
            const loadingScreen = document.getElementById('loading-screen');

            let totalAssets = images.length + 2;
            let loadedAssets = 0;

            function finishLoading() {
                if (loadingScreen) {
                    loadingScreen.classList.add('fade-out');
                    document.getElementById('screen-1').classList.add('active');
                    history.replaceState({ screen: 'screen-1', transition: 'zoom' }, '', '');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
                }
            }

            function updateProgress() {
                loadedAssets++;
                let percentage = Math.floor((loadedAssets / totalAssets) * 100);
                if (percentage > 100) percentage = 100;
                if (loaderBar) loaderBar.style.width = percentage + '%';
                if (loaderPercentage) loaderPercentage.innerText = percentage + '%';
                if (loadedAssets >= totalAssets) setTimeout(finishLoading, 400);
            }

            if (totalAssets === 0) { setTimeout(finishLoading, 400); return; }

            images.forEach(img => {
                if (img.complete) updateProgress();
                else { img.addEventListener('load', updateProgress); img.addEventListener('error', updateProgress); }
            });

            [bgMusic, voiceAudio].forEach(audio => {
                if (audio) {
                    audio.addEventListener('canplaythrough', updateProgress, { once: true });
                    audio.addEventListener('error', updateProgress, { once: true });
                    if (audio.readyState >= 3) updateProgress();
                }
            });
        });


        /* ==================== 2. NAVIGATION & HISTORY STATES ==================== */
        function goToScreen(screenId, transitionType = 'zoom', pushHistory = true) {
            const currentActive = document.querySelector('.screen.active');
            const targetScreen = document.getElementById(screenId);
            if (!currentActive || currentActive === targetScreen) return;

            if (screenId === 'screen-moment') {
                const scrollContainer = document.getElementById('momentScroll');
                const scrollHint = document.getElementById('scrollHint');
                if (scrollContainer) scrollContainer.scrollTop = 0;
                if (scrollHint) scrollHint.style.opacity = '0.9';
            }

            currentActive.classList.remove('active');
            
            let exitClass = 'exiting-zoom';
            if (transitionType === 'slide') exitClass = 'exiting-slide';
            if (transitionType === 'rotate') exitClass = 'exiting-rotate';

            currentActive.classList.add(exitClass);
            targetScreen.classList.add('active');

            if (pushHistory) {
                history.pushState({ screen: screenId, transition: transitionType }, '', '');
            }

            setTimeout(() => { currentActive.classList.remove(exitClass); }, 1100);
        }

        window.addEventListener('popstate', (event) => {
            if (modal.classList.contains('active')) { closeModal(); return; }
            if (voiceModal.classList.contains('active')) { closeVoiceModal(); return; }

            const targetScreenId = event.state && event.state.screen ? event.state.screen : 'screen-1';
            const transition = event.state && event.state.transition ? event.state.transition : 'slide';
            goToScreen(targetScreenId, transition, false);
        });

        function openSurprise() {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.play().catch(error => {
                console.log("Autoplay dicegah browser:", error);
            });
            goToScreen('screen-2', 'zoom');
        }


        /* ==================== 3. LIGHTBOX ZOOM & PAN ==================== */
        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, panning = false, initialDistance = null, lastTap = 0;
        const modal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');

        function updateTransform() {
            modalImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function handlePhotoClick(event) {
            const imgEl = event.target;
            const rect = imgEl.getBoundingClientRect();
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
            modalImg.src = imgEl.src;
            scale = 1; pointX = 0; pointY = 0;
            updateTransform();
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            scale = 1; pointX = 0; pointY = 0;
            updateTransform();
        }

        modalImg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true; startX = e.touches[0].clientX - pointX; startY = e.touches[0].clientY - pointY;
            }
        });

        modalImg.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance) {
                let currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = Math.min(Math.max(1, scale * (currentDistance / initialDistance)), 4);
                initialDistance = currentDistance;
                updateTransform();
            } else if (e.touches.length === 1 && panning && scale > 1) {
                pointX = e.touches[0].clientX - startX; pointY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        modalImg.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialDistance = null;
            if (e.touches.length === 0) panning = false;
            if (scale <= 1) { scale = 1; pointX = 0; pointY = 0; updateTransform(); }
        });

        modalImg.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = e.deltaY < 0 ? Math.min(scale + 0.15, 4) : Math.max(scale - 0.15, 1);
            if (scale === 1) { pointX = 0; pointY = 0; }
            updateTransform();
        });

        modalImg.addEventListener('mousedown', (e) => {
            if (scale > 1) { panning = true; startX = e.clientX - pointX; startY = e.clientY - pointY; }
        });

        window.addEventListener('mousemove', (e) => {
            if (!panning) return;
            pointX = e.clientX - startX; pointY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { panning = false; });

        modalImg.addEventListener('click', (e) => {
            let now = new Date().getTime();
            if (now - lastTap < 300 && now - lastTap > 0) {
                scale = scale > 1 ? 1 : 2.5;
                pointX = 0; pointY = 0;
                updateTransform();
            }
            lastTap = now;
        });


        /* ==================== 4. VOICE NOTE PLAYER WITH DUCKING EFFECT ==================== */
        const bgMusic = document.getElementById('bgMusic');
        const voiceAudio = document.getElementById('voiceAudio');
        const voiceModal = document.getElementById('voiceModal');
        const playIconSvg = document.getElementById('playIconSvg');
        const pauseIconSvg = document.getElementById('pauseIconSvg');
        const reelLeft = document.getElementById('reelLeft');
        const reelRight = document.getElementById('reelRight');

        function openVoiceModal() { voiceModal.classList.add('active'); }

        function closeVoiceModal() {
            voiceModal.classList.remove('active');
            voiceAudio.pause();
            voiceAudio.currentTime = 0;
            bgMusic.volume = 1.0; 
            playIconSvg.style.display = 'block';
            pauseIconSvg.style.display = 'none';
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
        }

        function togglePlayVoice() {
            if (voiceAudio.paused) {
                bgMusic.volume = 0.2; 
                voiceAudio.play();
                playIconSvg.style.display = 'none';
                pauseIconSvg.style.display = 'block';
                reelLeft.classList.add('spinning');
                reelRight.classList.add('spinning');
            } else {
                voiceAudio.pause();
                bgMusic.volume = 1.0; 
                playIconSvg.style.display = 'block';
                pauseIconSvg.style.display = 'none';
                reelLeft.classList.remove('spinning');
                reelRight.classList.remove('spinning');
            }
        }

        voiceAudio.addEventListener('ended', () => {
            bgMusic.volume = 1.0; 
            playIconSvg.style.display = 'block';
            pauseIconSvg.style.display = 'none';
            reelLeft.classList.remove('spinning');
            reelRight.classList.remove('spinning');
        });


        /* ==================== 5. OPTIMIZED PARTICLES & ENGINE ==================== */
        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'explosion-particle';
                const size = Math.random() * 8 + 6;
                p.style.width = `${size}px`; p.style.height = `${size}px`;
                p.style.left = `${x}px`; p.style.top = `${y}px`;
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 40;
                p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 700);
            }
        }

        const momentScroll = document.getElementById('momentScroll');
        const scrollHint = document.getElementById('scrollHint');
        if (momentScroll && scrollHint) {
            momentScroll.addEventListener('scroll', () => {
                scrollHint.style.opacity = momentScroll.scrollTop > 25 ? '0' : '0.9';
            });
        }

        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let isPageActive = true;

        document.addEventListener("visibilitychange", () => {
            isPageActive = document.visibilityState === "visible";
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = -Math.random() * 0.35 - 0.1;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.isBokeh = Math.random() > 0.85;
            }
            update() { this.x += this.speedX; this.y += this.speedY; }
            draw() {
                ctx.save();
                if (this.isBokeh) {
                    ctx.fillStyle = `rgba(243, 219, 160, ${this.opacity * 0.3})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = `rgba(243, 219, 160, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particlesArray = [];
            let isMobile = window.innerWidth < 600;
            let cores = navigator.hardwareConcurrency || 4;
            let numParticles = isMobile ? (cores <= 4 ? 18 : 30) : (cores <= 4 ? 40 : 70);
            for (let i = 0; i < numParticles; i++) particlesArray.push(new Particle());
        }
        initParticles();

        function animateParticles() {
            if (isPageActive) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
